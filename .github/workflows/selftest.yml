name: Selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  selftest:
    # Same convention as the other repos: set the RUNS_ON repo variable (e.g. ["self-hosted","rog"])
    # once a self-hosted runner is registered to this repo; until then it runs on GitHub-hosted ubuntu.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selftest
        # The rog runner is a systemd user service in WSL with no logind session, so systemd-inhibit is denied
        # there (it prints "Failed to inhibit: Access denied"). Run the full lifecycle with the no-op backend;
        # run a plain `node keepawake.js selftest` on a real desktop to cover the OS lock itself.
        env:
          KEEPAWAKE_BACKEND: ${{ runner.os == 'Linux' && 'none' || '' }}
        run: node keepawake.js selftest
